# Standard Gibbs energies of formation from the elements, kJ/mol, at 1200 K and 1300 K.
# Sources: NIST-JANAF (J), Robie & Hemingway 1995 USGS Bulletin 2131 (RH), others as noted.
# sd: 1-sigma uncertainty used in the Monte Carlo, kJ/mol per formula unit (my assignment from source quality).
species:
  CaCl2:     {dfG: {1200: -616.153, 1300: -603.921}, sd: 1.0, src: "JANAF Ca-011 (liquid)"}
  CaO:       {dfG: {1200: -509.239, 1300: -498.082}, sd: 1.0, src: "JANAF Ca-027"}
  MgO:       {dfG: {1200: -469.844, 1300: -458.291}, sd: 1.0, src: "JANAF Mg-008"}
  Al2O3:     {dfG: {1200: -1295.228, 1300: -1262.264}, sd: 1.5, src: "JANAF Al-096 (alpha)"}
  TiO2:      {dfG: {1200: -727.113, 1300: -709.265}, sd: 1.0, src: "JANAF O-043 (rutile)"}
  SiO2:      {dfG: {1200: -695.426, 1300: -678.114}, sd: 1.0, src: "JANAF O-039 (quartz)"}
  FeO:       {dfG: {1200: -194.316, 1300: -187.947}, sd: 2.0, src: "JANAF Fe-018 (stoichiometric)"}
  MnO:       {dfG: {1200: -296.8, 1300: -289.4}, sd: 2.0, src: "RH p.199"}
  anorthite: {dfG: {1200: -3324.7, 1300: -3248.0}, sd: 5.0, src: "RH p.362, CaAl2Si2O8"}
  diopside:  {dfG: {1200: -2503.8, 1300: -2445.5}, sd: 4.0, src: "RH p.347, CaMgSi2O6"}
  forsterite: {dfG: {1200: -1691.8, 1300: -1651.1}, sd: 4.0, src: "RH p.335, Mg2SiO4 (JANAF gives -1697.0)"}
  fayalite:  {dfG: {1200: -1088.7, 1300: -1056.8}, sd: 4.0, src: "RH p.332, Fe2SiO4"}
  ilmenite:  {dfG: {1200: -933.0, 1300: -908.5}, sd: 3.0, src: "RH p.235, FeTiO3"}
  wollastonite: {dfG: {1200: -1293.1, 1300: -1264.4}, sd: 3.0, src: "RH p.342, CaSiO3"}
  perovskite: {dfG: {1200: -1323.9, 1300: -1295.6}, sd: 3.0, src: "RH p.232, CaTiO3"}
  Mg2Si:     {dfG: {1200: -68.536, 1300: -66.095}, sd: 2.0, src: "JANAF Mg-034"}
  FeSi:      {dfG: {1200: -68.75, 1300: -67.74}, sd: 8.0, src: "Pankratz et al. 1984 fit via Nikolaychuk 2019; literature spread at 298 K is ~20 kJ"}
  # Calcium silicides: only enthalpies at 298 K (Brutti et al. 2001). dfG(1223) ~ dfH; formation entropy of
  # intermetallics is small; carried as sd = T * 5 J/(mol-atom K) * atoms.
  CaSi2:     {dfG: {1200: -113.4, 1300: -113.4}, sd: 19.0, src: "Brutti 2001 dfH298 = -37.8 kJ/mol-atom; dG ~ dH assumed"}
  CaSi:      {dfG: {1200: -99.2, 1300: -99.2}, sd: 13.0, src: "Brutti 2001 dfH298 = -49.6 kJ/mol-atom; dG ~ dH assumed"}
  spinel:    {dfG: {1200: -1799.7, 1300: -1756.1}, sd: 4.0, src: "RH p.237, MgAl2O4"}
  gehlenite: {dfG: {1200: -3178.2, 1300: -3108.3}, sd: 5.0, src: "RH p.314, Ca2Al2SiO7"}
